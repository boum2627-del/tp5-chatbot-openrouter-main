<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Chatbot OpenRouter</title>

    <style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(-45deg, #6a11cb, #2575fc, #ff6ec4, #7873f5);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
    padding: 30px;
    color: white;
    transition: background 0.5s ease;
}

/* Dark mode */
.dark-mode {
    background: linear-gradient(-45deg, #141e30, #243b55, #000000, #434343);
}

@keyframes gradientBG {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

h2 {
    animation: fadeInDown 1s ease;
}

@keyframes fadeInDown {
    from {opacity: 0; transform: translateY(-20px);}
    to {opacity: 1; transform: translateY(0);}
}

#chat-box {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    padding: 15px;
    height: 300px;
    overflow-y: auto;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    margin-bottom: 15px;
    animation: fadeIn 1.5s ease;
    display: flex;
    flex-direction: column;
}

input {
    padding: 10px;
    width: 70%;
    border-radius: 10px;
    border: none;
    outline: none;
}

button {
    padding: 10px 18px;
    background: #ff6ec4;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
}

button:hover {
    transform: scale(1.1);
    background: #ff3cac;
}

.message {
    padding: 10px 15px;
    margin: 8px 0;
    border-radius: 15px;
    max-width: 75%;
    animation: fadeMsg 0.3s ease;
}

.user {
    background: #ff6ec4;
    margin-left: auto;
    text-align: right;
}

.bot {
    background: rgba(255,255,255,0.25);
    margin-right: auto;
    text-align: left;
}

@keyframes fadeMsg {
    from {opacity: 0; transform: translateY(5px);}
    to {opacity: 1; transform: translateY(0);}
}
    </style>

</head>
<body>

    <h2>Chatbot Intelligent – TP Web API</h2>

    <!-- Dark Mode Button -->
    <button id="theme-toggle" style="margin-bottom:15px;">🌙 Mode Sombre</button>

    <p>Ce chatbot utilise une API publique via Fetch pour générer des réponses dynamiques.</p>

    <div id="chat-box"></div>

    <input type="text" id="user-input" placeholder="Posez votre question...">
    <button id="send-btn">Envoyer</button>

    <script src="script.js"></script>
</body>
</html>
